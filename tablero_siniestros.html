<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siniestros Viales · CEM Esquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --azul-800:#0a3a68;--azul-700:#0e5a9e;--azul-50:#e8f0f8;
  --ocre-500:#b8863d;--ocre-100:#f0dfc0;
  --papel:#f8f5ee;--papel2:#eee6d5;--tinta:#171614;
  --neutro:#6b6760;--borde:#ddd8cc;
  --verde:#2f7d32;--rojo:#a8322c;--amarillo:#c9971a;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;--r:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);font-size:15px;line-height:1.5;}

.hdr{background:var(--azul-800);padding:1.5rem 2rem 1.25rem;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent,transparent 22px,rgba(184,134,61,.07) 22px,rgba(184,134,61,.07) 23px);pointer-events:none;}
.hdr-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.hdr-badge{display:inline-block;background:var(--rojo);color:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:4px;margin-bottom:10px;}
.hdr-title{font-size:22px;font-weight:500;color:#fff;}
.hdr-sub{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.55);margin-top:5px;}
.hdr-periodo{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.7);}
.hdr-estado{position:relative;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);margin-top:1rem;}
.dot{width:7px;height:7px;border-radius:50%;background:#4caf50;flex-shrink:0;}
.dot.cargando{background:var(--ocre-500);animation:p 1.2s infinite;}
.dot.err{background:var(--rojo);}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

.filtros{background:#fff;border-bottom:1px solid var(--borde);padding:.75rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.fil-lbl{font-family:var(--mono);font-size:11px;color:var(--neutro);text-transform:uppercase;letter-spacing:.06em;}
.fil-sel{font-family:var(--mono);font-size:12px;padding:5px 10px;border:1px solid var(--borde);border-radius:4px;background:var(--papel);color:var(--tinta);cursor:pointer;outline:none;}
.fil-sel:focus{border-color:var(--azul-700);}
.fil-btn{font-family:var(--sans);font-size:12px;font-weight:500;padding:5px 14px;border-radius:4px;cursor:pointer;border:1px solid var(--azul-700);background:var(--azul-700);color:#fff;}
.fil-btn:hover{background:var(--azul-800);}
.fil-btn.sec{background:transparent;color:var(--azul-700);}
.fil-btn.sec:hover{background:var(--azul-50);}
.fil-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--neutro);}

.contenido{max-width:1280px;margin:0 auto;padding:1.5rem 2rem 3rem;}
.seccion{margin-bottom:2rem;}
.sec-titulo{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--neutro);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.875rem;padding-bottom:.5rem;border-bottom:1px solid var(--borde);}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;}
.mc{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:.875rem 1rem;border-left-width:3px;}
.mc.azul{border-left-color:var(--azul-700);}
.mc.rojo{border-left-color:var(--rojo);}
.mc.ocre{border-left-color:var(--ocre-500);}
.mc.verde{border-left-color:var(--verde);}
.mc.amar{border-left-color:var(--amarillo);}
.m-lbl{font-family:var(--mono);font-size:10px;color:var(--neutro);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.m-val{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1;color:var(--tinta);}
.m-sub{font-size:11px;color:var(--neutro);margin-top:4px;}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:720px){.chart-grid{grid-template-columns:1fr;}}
.cc{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:1rem 1.125rem;}
.cc.full{grid-column:1/-1;}
.ct{font-size:13px;font-weight:500;color:var(--tinta);margin-bottom:.875rem;}

.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bl{font-family:var(--mono);font-size:11px;color:var(--tinta);min-width:130px;max-width:130px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bt{flex:1;height:13px;background:var(--papel2);border-radius:2px;overflow:hidden;}
.bf{height:100%;border-radius:2px;transition:width .5s;}
.bn{font-family:var(--mono);font-size:11px;color:var(--neutro);min-width:24px;}

.hm{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;}
.hc{height:36px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;}
.hc:hover{outline:2px solid var(--rojo);}
.hh{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:3px;}
.hhr{font-family:var(--mono);font-size:9px;color:var(--neutro);text-align:center;}
.hml{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--neutro);}
.hmg{width:80px;height:10px;background:linear-gradient(to right,#fae9e8,#a8322c);border-radius:2px;}

.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--neutro);text-transform:uppercase;letter-spacing:.07em;padding:7px 10px;border-bottom:1px solid var(--borde);background:var(--papel);white-space:nowrap;text-align:left;}
td{padding:7px 10px;border-bottom:1px solid var(--borde);color:var(--tinta);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--azul-50);}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:4px;}
.bu{background:var(--azul-50);color:var(--azul-700);}
.br{background:var(--ocre-100);color:#7a5a20;}
.bsu{background:#f3e5f5;color:#6a1b9a;}
.bnd{background:var(--papel2);color:var(--neutro);}

.ley{display:flex;gap:16px;flex-wrap:wrap;margin-top:.5rem;}
.li{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--neutro);}
.ls{width:12px;height:12px;border-radius:2px;flex-shrink:0;}

.err-box{background:#fae9e8;border:1px solid #f0b8b5;border-radius:var(--r);padding:1.25rem 1.5rem;font-size:13px;color:var(--rojo);margin:1.5rem;}
.err-box code{font-family:var(--mono);font-size:11px;display:block;margin-top:.5rem;word-break:break-all;color:var(--tinta);}

footer{text-align:center;font-family:var(--mono);font-size:11px;color:var(--neutro);padding:1.5rem 2rem;border-top:1px solid var(--borde);margin-top:1rem;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div>
      <div class="hdr-badge">CEM · Secretaría de Tránsito</div>
      <h1 class="hdr-title">Siniestros viales</h1>
      <div class="hdr-sub">Municipio de Esquina · Corrientes · Argentina</div>
    </div>
    <div><div class="hdr-periodo" id="hdr-p"></div></div>
  </div>
  <div class="hdr-estado">
    <span class="dot cargando" id="dot"></span>
    <span id="est">Cargando datos desde Google Sheets…</span>
  </div>
</header>

<div class="filtros" id="filtros" style="display:none;">
  <span class="fil-lbl">Inspector</span>
  <select class="fil-sel" id="fi"><option value="">Todos</option></select>
  <span class="fil-lbl">Año</span>
  <select class="fil-sel" id="fa"><option value="">Todos</option></select>
  <span class="fil-lbl">Zona</span>
  <select class="fil-sel" id="fz"><option value="">Todas</option></select>
  <span class="fil-lbl">Impacto</span>
  <select class="fil-sel" id="fm"><option value="">Todos</option></select>
  <button class="fil-btn" onclick="apFil()">Aplicar</button>
  <button class="fil-btn sec" onclick="resFil()">Limpiar</button>
  <span class="fil-count" id="fc"></span>
</div>

<main class="contenido" id="cont">
  <div style="text-align:center;padding:4rem;font-family:var(--mono);font-size:13px;color:var(--neutro);">Cargando…</div>
</main>

<footer>Centro Estadístico Municipal (CEM) · Gobierno de Esquina · <span id="fts"></span></footer>

<script>
// ── URL CSV publicado — reemplazar si cambia ──────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS85p2PFDEKhREl0C-ERzMUzfDNSui6eJniTOnV_5VZRAQe0dAzKcps3Yc9V_r2aJJXgFTElqwZ4Ski/pub?output=csv';

// ── Columnas exactas (fila 2 del sheet, tras borrar fila 1) ───
const C = {
  timestamp: 'Marca temporal',
  hora:      'Hora del siniestro',
  fecha:     'Fecha del siniestro',
  lugar:     'Lugar',
  zona:      'Zona',
  marcaV1:   'Marca del Veh\u00edculo N\u00b0 1',
  modeloV1:  'Modelo del Veh\u00edculo N\u00b0 1',
  tipoV1:    'Tipo',
  domV1:     'Dominio del Veh\u00edculo N\u00b0 1',
  marcaV2:   'Marca del Veh\u00edculo N\u00b0 2',
  modeloV2:  'Modelo del Veh\u00edculo N\u00b0 2',
  tipoV2:    'Tipo 2',
  domV2:     'Dominio del Veh\u00edculo N\u00b0 2',
  superficie:'Estado de la Superficie',
  clima:     'Situaci\u00f3n clim\u00e1tica y visibilidad',
  impacto:   'Tipo de Impacto',
  inspector: 'Inspector de tr\u00e1nsito Nombre',
  legajo:    'Legajo del Inspector',
  secretario:'Secretario Nombre',
  infracc:   'Regla/s de tr\u00e1nsito infringida/s',
  obsFin:    'Observaciones finales',
  condV1:    'Apellido y Nombre del Conductor N\u00b0 1',
  condV2:    'Conductor del Veh\u00edculo N\u00b0 2',
  edadV1:    'Edad del Conductor N\u00b0 1',
  edadV2:    'Edad del Conductor N\u00b0 2',
};

// ── Parseo CSV ────────────────────────────────────────────────
function parseCSV(txt) {
  const lines = txt.trim().split(/\r?\n/);
  if (lines.length < 3) return [];
  // Fila 0 = títulos de sección (DATOS DEL SINIESTRO, VEHÍCULO N°1...) — se ignora
  // Fila 1 = headers reales (Marca temporal, Hora del siniestro...)
  // Fila 2+ = datos
  const headers = splitRow(lines[1]).map(h => h.trim());
  return lines.slice(2).map(l => {
    const vals = splitRow(l);
    const o = {};
    headers.forEach((h, i) => { o[h] = (vals[i] || '').trim(); });
    return o;
  }).filter(r => Object.values(r).some(v => v && v.replace(/[\s\/\-\.]/g,'') !== ''));
}

function splitRow(line) {
  const res = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { res.push(cur); cur = ''; }
    else cur += line[i];
  }
  res.push(cur);
  return res;
}

function v(row, key) {
  const val = row[key] || '';
  const s = val.trim();
  return /^[\s\/\-\.\\]+$/.test(s) ? '' : s;
}

// ── Normalización ─────────────────────────────────────────────
function normZona(z) {
  if (!z) return 'Sin dato';
  const l = z.toLowerCase();
  if (l.includes('sub')) return 'Sub urbana';
  if (l.includes('urban')) return 'Urbana';
  if (l.includes('rural')) return 'Rural';
  return z;
}

function normMarca(s) {
  if (!s) return 'Sin dato';
  const l = s.toLowerCase();
  const m = [
    ['honda','Honda'],['volkswagen','Volkswagen'],['toyota','Toyota'],
    ['chevrolet','Chevrolet'],['renault','Renault'],['fiat','Fiat'],
    ['keller','Keller'],['corven','Corven'],['guerrero','Guerrero'],
    ['yamaha','Yamaha'],['zanella','Zanella'],['peugeot','Peugeot'],
    ['motomel','Motomel'],['ford','Ford'],['nissan','Nissan'],
    ['brava','Brava'],['mercedes','Mercedes Benz'],['citroen','Citroën'],
    ['euromot','Euromot'],['motomel','Motomel'],['zs','ZS Motor'],
    ['appia','Appia'],['gilera','Gilera'],['hermann','Hermann'],
  ];
  for (const [k,n] of m) { if (l.includes(k)) return n; }
  if (!s || /^(no posee|\/\/|—|\s*)$/i.test(s)) return 'Sin dato';
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}

function normImpacto(s) {
  if (!s) return 'Sin dato';
  const l = s.toLowerCase();
  if (l.includes('choque')) return 'Choque';
  if (l.includes('atropello')) return 'Atropello';
  if (l.includes('ca\xedda') || l.includes('caida')) return 'Caída';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function normClima(s) {
  if (!s) return 'Sin dato';
  const l = s.toLowerCase();
  if (l.includes('noche')) return 'Noche';
  if (l.includes('d\xeda') || l.includes('dia')) return 'Día';
  return s.split(',')[0].trim();
}

function normSup(s) {
  if (!s) return 'Sin dato';
  const l = s.toLowerCase();
  if (l.includes('ptimo') || l.includes('bueno')) return 'Bueno / Óptimo';
  if (l.includes('regular')) return 'Regular';
  if (l.includes('malo')) return 'Malo';
  return s.split(',')[0].trim();
}

function getAnio(r) {
  const f = v(r, C.fecha);
  if (!f) return 'Sin fecha';
  let m = f.match(/(\d{4})/);
  if (m) return m[1];
  const p = f.split('/');
  if (p.length === 3) { const y = parseInt(p[2]); return y > 2000 ? String(y) : 'Sin fecha'; }
  return 'Sin fecha';
}

function getHora(r) {
  const h = v(r, C.hora);
  if (!h) return -1;
  const n = parseInt(h.split(':')[0]);
  return isNaN(n) ? -1 : n;
}

function hayHosp(r) {
  const obs = (v(r, C.obsFin) + ' ' + v(r, C.infracc)).toLowerCase();
  return obs.includes('hospital');
}

function tipoVehiculo(t) {
  if (!t) return 'Sin dato';
  const l = t.toLowerCase();
  if (l.includes('moto')) return 'Motocicleta';
  if (l.includes('pick') || l.includes('camioneta')) return 'Camioneta/Pick up';
  if (l.includes('sedan') || l.includes('auto')) return 'Automóvil';
  if (l.includes('cami\xf3n') || l.includes('camion')) return 'Camión';
  if (l.includes('furgon') || l.includes('furgón')) return 'Furgón';
  if (l.includes('bici')) return 'Bicicleta';
  return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
}

function normalizar(raw) {
  return raw.map(r => ({
    _fecha:   v(r, C.fecha),
    _hora:    v(r, C.hora),
    _hNum:    getHora(r),
    _anio:    getAnio(r),
    _lugar:   v(r, C.lugar) || '—',
    _zona:    normZona(v(r, C.zona)),
    _impacto: normImpacto(v(r, C.impacto)),
    _clima:   normClima(v(r, C.clima)),
    _sup:     normSup(v(r, C.superficie)),
    _insp:    v(r, C.inspector) || 'Sin dato',
    _mV1:     normMarca(v(r, C.marcaV1)),
    _mV2:     normMarca(v(r, C.marcaV2)),
    _tV1:     tipoVehiculo(v(r, C.tipoV1)),
    _tV2:     tipoVehiculo(v(r, C.tipoV2)),
    _hosp:    hayHosp(r),
    _raw:     r,
  }));
}

// ── Estado global ─────────────────────────────────────────────
let TODOS = [], FILTRADOS = [];
let chartEvol = null, chartZona = null;

// ── Carga ─────────────────────────────────────────────────────
async function cargar() {
  setEst('cargando', 'Cargando datos desde Google Sheets…');
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const raw = parseCSV(txt);
    if (!raw.length) throw new Error('El CSV no tiene datos válidos.');
    TODOS = normalizar(raw);
    FILTRADOS = [...TODOS];
    poblarFiltros();
    renderTodo();
    const ts = new Date().toLocaleString('es-AR', {dateStyle:'short', timeStyle:'short'});
    setEst('ok', 'Datos actualizados · ' + ts + ' · ' + TODOS.length + ' registros');
    document.getElementById('fts').textContent = 'Última carga: ' + ts;
    document.getElementById('filtros').style.display = 'flex';
  } catch(e) {
    setEst('err', 'Error al cargar: ' + e.message);
    document.getElementById('cont').innerHTML =
      '<div class="err-box"><strong>No se pudieron cargar los datos.</strong><br><br>' +
      'Verificá que la planilla esté publicada como CSV (Archivo → Publicar en la web).' +
      '<code>' + e.message + '</code></div>';
  }
}

function setEst(tipo, txt) {
  document.getElementById('dot').className = 'dot' + (tipo==='cargando'?' cargando':tipo==='err'?' err':'');
  document.getElementById('est').textContent = txt;
}

// ── Filtros ───────────────────────────────────────────────────
function poblarFiltros() {
  poblar('fi', [...new Set(TODOS.map(r=>r._insp))].sort());
  poblar('fa', [...new Set(TODOS.map(r=>r._anio))].filter(a=>a!=='Sin fecha').sort());
  poblar('fz', [...new Set(TODOS.map(r=>r._zona))].sort());
  poblar('fm', [...new Set(TODOS.map(r=>r._impacto))].sort());
}

function poblar(id, vals) {
  const s = document.getElementById(id);
  const first = s.options[0].outerHTML;
  s.innerHTML = first;
  vals.forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; s.appendChild(o); });
}

function apFil() {
  const insp = document.getElementById('fi').value;
  const anio = document.getElementById('fa').value;
  const zona = document.getElementById('fz').value;
  const imp  = document.getElementById('fm').value;
  FILTRADOS = TODOS.filter(r =>
    (!insp || r._insp===insp) && (!anio || r._anio===anio) &&
    (!zona || r._zona===zona) && (!imp  || r._impacto===imp)
  );
  renderTodo();
}

function resFil() {
  ['fi','fa','fz','fm'].forEach(id => document.getElementById(id).value='');
  FILTRADOS = [...TODOS];
  renderTodo();
}

// ── Helpers ───────────────────────────────────────────────────
function contarPor(arr, campo) {
  const c = {};
  arr.forEach(r => { const k = r[campo]||'Sin dato'; c[k]=(c[k]||0)+1; });
  return Object.entries(c).sort((a,b) => b[1]-a[1]);
}

function pct(n, t) { return t ? Math.round((n/t)*100)+'%' : '0%'; }

// ── Render principal ──────────────────────────────────────────
function renderTodo() {
  const d = FILTRADOS;
  document.getElementById('fc').textContent = d.length + ' registros';
  const anios = [...new Set(d.map(r=>r._anio).filter(a=>a!=='Sin fecha'))].sort();
  document.getElementById('hdr-p').textContent = anios.length ? anios.join(' – ') : '';

  document.getElementById('cont').innerHTML = `
    <div class="seccion">
      <div class="sec-titulo">Resumen general</div>
      <div class="metric-grid" id="metrics"></div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Distribución geográfica y tipo de siniestro</div>
      <div class="chart-grid">
        <div class="cc">
          <div class="ct">Zona del siniestro</div>
          <div style="position:relative;width:100%;height:200px;">
            <canvas id="ch-zona" role="img" aria-label="Distribución por zona"></canvas>
          </div>
          <div class="ley" id="ley-zona"></div>
        </div>
        <div class="cc">
          <div class="ct">Tipo de impacto</div>
          <div class="bars" id="ch-imp"></div>
        </div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Vehículos involucrados</div>
      <div class="chart-grid">
        <div class="cc">
          <div class="ct">Marca — Vehículo N° 1</div>
          <div class="bars" id="ch-m1"></div>
        </div>
        <div class="cc">
          <div class="ct">Marca — Vehículo N° 2</div>
          <div class="bars" id="ch-m2"></div>
        </div>
      </div>
      <div class="chart-grid" style="margin-top:12px;">
        <div class="cc">
          <div class="ct">Tipo de vehículo N° 1</div>
          <div class="bars" id="ch-t1"></div>
        </div>
        <div class="cc">
          <div class="ct">Tipo de vehículo N° 2</div>
          <div class="bars" id="ch-t2"></div>
        </div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Evolución por año</div>
      <div class="cc full">
        <div class="ct">Siniestros registrados por año</div>
        <div style="position:relative;width:100%;height:220px;">
          <canvas id="ch-evol" role="img" aria-label="Siniestros por año"></canvas>
        </div>
        <div class="ley" id="ley-evol"></div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Distribución horaria — hora del siniestro</div>
      <div class="cc full">
        <div style="overflow-x:auto;">
          <div class="hm" id="ch-hm"></div>
          <div class="hh" id="ch-hrs"></div>
        </div>
        <div class="hml"><span>0</span><div class="hmg"></div><span>máx</span></div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Inspectores actuantes · Superficie · Condición climática</div>
      <div class="chart-grid">
        <div class="cc"><div class="ct">Por inspector</div><div class="bars" id="ch-insp"></div></div>
        <div class="cc"><div class="ct">Estado de la superficie</div><div class="bars" id="ch-sup"></div></div>
      </div>
      <div class="chart-grid" style="margin-top:12px;">
        <div class="cc full"><div class="ct">Condición climática</div><div class="bars" id="ch-clim"></div></div>
      </div>
    </div>
    <div class="seccion">
      <div class="sec-titulo">Últimos 20 siniestros registrados</div>
      <div class="cc full" style="padding:.75rem;">
        <div class="tw">
          <table>
            <thead><tr>
              <th>Fecha</th><th>Hora</th><th>Lugar</th><th>Zona</th>
              <th>Impacto</th><th>Veh. 1</th><th>Veh. 2</th>
              <th>Hospitalizado</th><th>Inspector</th>
            </tr></thead>
            <tbody id="tabla"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  renderMetrics(d);
  renderZona(d);
  renderBars('ch-imp',  contarPor(d,'_impacto'), '#0e5a9e');
  renderBars('ch-m1',   contarPor(d,'_mV1'),     '#a8322c');
  renderBars('ch-m2',   contarPor(d,'_mV2'),     '#b8863d');
  renderBars('ch-t1',   contarPor(d,'_tV1'),     '#0a3a68');
  renderBars('ch-t2',   contarPor(d,'_tV2'),     '#2f7d32');
  renderEvol(d);
  renderHeatmap(d);
  renderBars('ch-insp', contarPor(d,'_insp'),    '#0e5a9e');
  renderBars('ch-sup',  contarPor(d,'_sup'),     '#2f7d32');
  renderBars('ch-clim', contarPor(d,'_clima'),   '#b8863d');
  renderTabla(d);
}

function renderMetrics(d) {
  const t = d.length;
  const urb  = d.filter(r=>r._zona==='Urbana').length;
  const rur  = d.filter(r=>r._zona==='Rural'||r._zona==='Sub urbana').length;
  const hosp = d.filter(r=>r._hosp).length;
  const cho  = d.filter(r=>r._impacto==='Choque').length;
  const atr  = d.filter(r=>r._impacto==='Atropello').length;
  document.getElementById('metrics').innerHTML =
    mc('azul','Total siniestros', t, 'en el período seleccionado') +
    mc('rojo','Urbanos',  urb,  pct(urb,t)+' del total') +
    mc('ocre','Rurales / suburbanos', rur, pct(rur,t)+' del total') +
    mc('amar','Choques',  cho,  pct(cho,t)+' del total') +
    mc('ocre','Atropellos', atr, pct(atr,t)+' del total') +
    mc('rojo','Con hospitalizados', hosp, pct(hosp,t)+' del total');
}

function mc(cls,lbl,val,sub) {
  return `<div class="mc ${cls}"><div class="m-lbl">${lbl}</div><div class="m-val">${val}</div><div class="m-sub">${sub}</div></div>`;
}

function renderZona(d) {
  const ord=['Urbana','Sub urbana','Rural','Sin dato'];
  const bgs={'Urbana':'#0e5a9e','Sub urbana':'#6a1b9a','Rural':'#b8863d','Sin dato':'#9e9e9e'};
  const datos = ord.map(k => d.filter(r=>r._zona===k).length);
  if (chartZona) { chartZona.destroy(); chartZona=null; }
  document.getElementById('ley-zona').innerHTML = ord.map((k,i)=>
    `<span class="li"><span class="ls" style="background:${bgs[k]};"></span>${k}: ${datos[i]}</span>`
  ).join('');
  chartZona = new Chart(document.getElementById('ch-zona'), {
    type:'doughnut',
    data:{ labels:ord, datasets:[{ data:datos, backgroundColor:ord.map(k=>bgs[k]), borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>' '+ctx.label+': '+ctx.raw}} },
      cutout:'60%' }
  });
}

function renderBars(id, data, color) {
  const max = data[0] ? data[0][1] : 1;
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = data.slice(0,9).map(([lbl,val]) =>
    `<div class="bar-row">
      <div class="bl" title="${lbl}">${lbl}</div>
      <div class="bt"><div class="bf" style="width:${Math.round((val/max)*100)}%;background:${color};"></div></div>
      <div class="bn">${val}</div>
    </div>`
  ).join('');
}

function renderEvol(d) {
  const anios = [...new Set(d.map(r=>r._anio).filter(a=>a!=='Sin fecha'))].sort();
  const counts = anios.map(a => d.filter(r=>r._anio===a).length);
  if (chartEvol) { chartEvol.destroy(); chartEvol=null; }
  document.getElementById('ley-evol').innerHTML =
    '<span class="li"><span class="ls" style="background:#a8322c;"></span>Siniestros por año</span>';
  chartEvol = new Chart(document.getElementById('ch-evol'), {
    type:'bar',
    data:{ labels:anios, datasets:[{ label:'Siniestros', data:counts, backgroundColor:'#a8322c', borderRadius:3, barPercentage:.55 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{mode:'index',intersect:false} },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:11,family:'IBM Plex Mono'},color:'#6b6760'} },
        y:{ beginAtZero:true, grid:{color:'rgba(0,0,0,0.05)'}, ticks:{font:{size:11,family:'IBM Plex Mono'},color:'#6b6760',stepSize:5} }
      }
    }
  });
}

function renderHeatmap(d) {
  const conteo = {};
  for (let i=0;i<24;i++) conteo[i]=0;
  d.filter(r=>r._hNum>=0).forEach(r=>{ conteo[r._hNum]=(conteo[r._hNum]||0)+1; });
  const maxC = Math.max(...Object.values(conteo), 1);
  const rojos = ['#fae9e8','#f5c4c3','#f09594','#e24b4a','#a32d2d','#791f1f','#501313'];
  const gc = v => v===0 ? rojos[0] : rojos[Math.min(6, Math.max(1, Math.ceil((v/maxC)*6)))];
  const gt = v => v>maxC*.4 ? '#fff' : '#6b6760';
  const hm = document.getElementById('ch-hm');
  const hr = document.getElementById('ch-hrs');
  if (!hm||!hr) return;
  let hH='', rH='';
  for (let h=0;h<24;h++) {
    const val = conteo[h]||0;
    hH += `<div class="hc" style="background:${gc(val)};color:${gt(val)};" title="${h}:00 — ${val} siniestros">${val||''}</div>`;
    rH += `<div class="hhr">${h}</div>`;
  }
  hm.innerHTML=hH; hr.innerHTML=rH;
}

function renderTabla(d) {
  const clsZ = {'Urbana':'bu','Rural':'br','Sub urbana':'bsu'};
  document.getElementById('tabla').innerHTML = [...d].reverse().slice(0,20).map(r =>
    `<tr>
      <td style="font-family:var(--mono);font-size:11px;white-space:nowrap;">${r._fecha}</td>
      <td style="font-family:var(--mono);font-size:11px;">${(r._hora||'—').slice(0,5)}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;">${r._lugar}</td>
      <td><span class="badge ${clsZ[r._zona]||'bnd'}">${r._zona}</span></td>
      <td style="font-size:11px;">${r._impacto}</td>
      <td style="font-size:11px;">${r._mV1} <span style="color:var(--neutro);font-size:10px;">${r._tV1!=='Sin dato'?'('+r._tV1+')':''}</span></td>
      <td style="font-size:11px;">${r._mV2} <span style="color:var(--neutro);font-size:10px;">${r._tV2!=='Sin dato'?'('+r._tV2+')':''}</span></td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center;color:${r._hosp?'var(--rojo)':'var(--neutro)'};">${r._hosp?'Sí':'No'}</td>
      <td style="font-size:11px;color:var(--neutro);">${r._insp}</td>
    </tr>`
  ).join('');
}

cargar();
</script>
</body>
</html>
